name: Tests unitaires

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Une nouvelle exécution sur la même branche annule la précédente.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          # Même version qu'en local : les tests de reconnaissance des pays dépendent des noms ISO fournis par Node.
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests unitaires
        run: npm test
