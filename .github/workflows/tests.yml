name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Une nouvelle exécution sur la même branche annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typage, lint, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          # Même version qu'en local : les tests de reconnaissance des pays dépendent des noms ISO fournis par Node.
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le style du code (oxlint)
        run: npm run lint

      - name: Lancer les tests unitaires
        run: npm test

      # `npm run build` lance d'abord `tsc -b` : le typage est vérifié en même temps que le build.
      - name: Vérifier le typage et construire le site
        run: npm run build
